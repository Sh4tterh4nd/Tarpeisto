# Tarpeisto Docker Swarm stack behind an existing Traefik overlay network.
#
# Create the external secrets and label the stateful-data node as described in
# README.md, then deploy with:
#   docker stack deploy -c infrastructure/compose/docker-stack.traefik.example.yml tarpeisto
#
# This stack uses its own secret names. Create them before deployment:
#   printf '%s' '<postgres-password>' | docker secret create tarpeisto_postgres_password -
#   printf '%s' '<s3-access-key>' | docker secret create tarpeisto_s3_access_key -
#   printf '%s' '<s3-secret-key>' | docker secret create tarpeisto_s3_secret_key -

services:
  app:
    # Kept as :main to match the supplied deployment. Pin this to an immutable
    # release version or digest before a production rollout.
    image: ghcr.io/sh4tterh4nd/tarpeisto:main
    networks:
      - traefik
      - tarpeisto
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tarpeisto
      SPRING_DATASOURCE_USERNAME: tarpeisto
      SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
      TARPEISTO_APPLICATION_DISPLAY_NAME: Tarpeisto
      TARPEISTO_APPLICATION_PUBLIC_BASE_URL: https://tarpeisto.kellermann.io
      TARPEISTO_S3_ENABLED: "true"
      TARPEISTO_S3_ENDPOINT: http://seaweedfs:8333
      TARPEISTO_S3_REGION: us-east-1
      TARPEISTO_S3_BUCKET: tarpeisto
      TARPEISTO_S3_PATH_STYLE_ACCESS: "true"
      TARPEISTO_AUTHENTICATION_MODE: LOCAL_ONLY
      TARPEISTO_AUTHENTICATION_AUTO_LINK_BY_EMAIL: "false"
      TARPEISTO_SECURITY_LOGIN_RATE_LIMIT_MAX_ATTEMPTS: "5"
      TARPEISTO_SECURITY_LOGIN_RATE_LIMIT_WINDOW: PT15M
    secrets:
      - source: postgres_password
        target: spring.datasource.password
      - source: s3_access_key
        target: tarpeisto.s3.access-key
      - source: s3_secret_key
        target: tarpeisto.s3.secret-key
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health/readiness HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"\\\"status\\\":\\\"UP\\\"\" <&3"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      replicas: 1
      labels:
        traefik.enable: "true"
        traefik.swarm.network: traefik
        traefik.http.routers.tarpeisto-secured.entrypoints: web-secured
        traefik.http.routers.tarpeisto-secured.middlewares: default-https@file
        traefik.http.routers.tarpeisto-secured.rule: Host(`tarpeisto.kellermann.io`)
        traefik.http.routers.tarpeisto-secured.tls.certresolver: mychallenge
        traefik.http.services.tarpeisto-secured.loadbalancer.server.port: "8080"
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        delay: 10s
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first

  postgres:
    image: postgres:18.6
    networks:
      - tarpeisto
    environment:
      POSTGRES_DB: tarpeisto
      POSTGRES_USER: tarpeisto
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: postgres_password
        target: postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarpeisto -d tarpeisto"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.tarpeisto-data == primary
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first

  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    networks:
      - tarpeisto
    entrypoint:
      - /bin/sh
      - -ec
      - |
        export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/s3_access_key)"
        export AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/s3_secret_key)"
        exec /entrypoint.sh mini -dir=/data
    environment:
      S3_BUCKET: tarpeisto
    secrets:
      - source: s3_access_key
        target: s3_access_key
      - source: s3_secret_key
        target: s3_secret_key
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.tarpeisto-data == primary
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
      rollback_config:
        parallelism: 1
        order: stop-first

volumes:
  postgres-data:
    driver: local
  seaweedfs-data:
    driver: local

networks:
  traefik:
    external: true
    name: traefik
  tarpeisto:
    driver: overlay
    attachable: true

secrets:
  postgres_password:
    external: true
    name: tarpeisto_postgres_password
  s3_access_key:
    external: true
    name: tarpeisto_s3_access_key
  s3_secret_key:
    external: true
    name: tarpeisto_s3_secret_key
