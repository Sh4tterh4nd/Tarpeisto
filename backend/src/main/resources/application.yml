spring:
  application:
    name: tarpeisto
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
  session:
    store-type: jdbc
    timeout: ${TARPEISTO_SESSION_TIMEOUT:30d}
    jdbc:
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 11MB
  threads:
    virtual:
      enabled: true

# spring.datasource.url / .username / .password are intentionally not set here. They come
# entirely from standard environment variables or mounted secret files imported as a Spring
# config tree; no credential or endpoint default belongs in a committed file. See
# application-dev.yml for a documented local-development-only convenience default.

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        max-age: ${TARPEISTO_SESSION_TIMEOUT:30d}
        http-only: true
        same-site: lax
        secure: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

tarpeisto:
  application:
    display-name: ${TARPEISTO_APPLICATION_DISPLAY_NAME:Tarpeisto}
  security:
    login-rate-limit:
      max-attempts: ${TARPEISTO_SECURITY_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${TARPEISTO_SECURITY_LOGIN_RATE_LIMIT_WINDOW:PT15M}
      max-client-attempts: ${TARPEISTO_SECURITY_LOGIN_RATE_LIMIT_MAX_CLIENT_ATTEMPTS:60}
      max-entries: ${TARPEISTO_SECURITY_LOGIN_RATE_LIMIT_MAX_ENTRIES:10000}
    asset-code-rate-limit:
      max-attempts: ${TARPEISTO_SECURITY_ASSET_CODE_RATE_LIMIT_MAX_ATTEMPTS:120}
      window: ${TARPEISTO_SECURITY_ASSET_CODE_RATE_LIMIT_WINDOW:PT1M}
      max-client-attempts: ${TARPEISTO_SECURITY_ASSET_CODE_RATE_LIMIT_MAX_CLIENT_ATTEMPTS:600}
      max-entries: ${TARPEISTO_SECURITY_ASSET_CODE_RATE_LIMIT_MAX_ENTRIES:10000}
  authentication:
    # LOCAL_ONLY (the default) or LOCAL_AND_OIDC. Selecting LOCAL_AND_OIDC without a usable
    # oidc.* configuration below fails application startup (AuthenticationProperties) rather
    # than starting half-configured (ADR-0003). Local login is always available in both modes.
    mode: ${TARPEISTO_AUTHENTICATION_MODE:LOCAL_ONLY}
    # Automatic verified-email linking is disabled by default (ADR-0003 "Linking policy": "Owner-
    # approved or preconfigured linking is the safe default"). An Owner opts in explicitly.
    auto-link-by-email: ${TARPEISTO_AUTHENTICATION_AUTO_LINK_BY_EMAIL:false}
    oidc:
      # All blank/unset by default (LOCAL_ONLY). Deployment values come from environment variables
      # or mounted secret files, never committed, per ADR-0003.
      display-name: ${TARPEISTO_OIDC_DISPLAY_NAME:}
      issuer-uri: ${TARPEISTO_OIDC_ISSUER_URI:}
      client-id: ${TARPEISTO_OIDC_CLIENT_ID:}
      client-secret: ${TARPEISTO_OIDC_CLIENT_SECRET:}
      scopes: ${TARPEISTO_OIDC_SCOPES:openid,profile,email}
  s3:
    enabled: ${TARPEISTO_S3_ENABLED:false}
    endpoint: ${TARPEISTO_S3_ENDPOINT:}
    region: ${TARPEISTO_S3_REGION:}
    bucket: ${TARPEISTO_S3_BUCKET:}
    access-key: ${TARPEISTO_S3_ACCESS_KEY:}
    secret-key: ${TARPEISTO_S3_SECRET_KEY:}
    path-style-access: ${TARPEISTO_S3_PATH_STYLE_ACCESS:true}
    chunked-encoding: ${TARPEISTO_S3_CHUNKED_ENCODING:true}
    server-side-encryption: ${TARPEISTO_S3_SERVER_SIDE_ENCRYPTION:}
    max-upload-bytes: ${TARPEISTO_S3_MAX_UPLOAD_BYTES:10485760}
