name: Validate

# Reusable validation workflow shared by pull-request checks and the publish
# workflow, per ADR-0004: "Repeat all required validation first; publication
# never replaces tests." Both callers invoke the exact same job.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Frontend and backend validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend format check
        working-directory: frontend
        run: pnpm format:check

      - name: Frontend lint
        working-directory: frontend
        run: pnpm lint

      - name: Frontend type check
        working-directory: frontend
        run: pnpm typecheck

      - name: Frontend unit tests
        working-directory: frontend
        run: pnpm test

      - name: Frontend production build
        working-directory: frontend
        run: pnpm build

      # Playwright end-to-end tests (`pnpm test:e2e`) are intentionally NOT
      # run here at Phase 0. They require `pnpm exec playwright install
      # --with-deps` plus a full running application (PostgreSQL, an
      # S3-compatible store, and the packaged backend serving the built
      # frontend), and no first-party "application under test" environment
      # exists in CI yet. Wire e2e into this workflow once that
      # application-under-test setup (Compose-in-CI or equivalent) is
      # designed, rather than adding a step that silently does nothing.

      - name: Backend formatting and tests
        working-directory: backend
        run: bash gradlew spotlessCheck check --stacktrace

      - name: Backend production image assembly (jibBuildTar)
        working-directory: backend
        # Never pass -PskipFrontend here: jib/jibBuildTar deliberately fail
        # when it is set, and this step exists specifically to prove the
        # complete production image (backend + compiled frontend) assembles.
        run: bash gradlew jibBuildTar --stacktrace
