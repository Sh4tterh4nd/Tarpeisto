name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

# Least-privilege default at workflow level. The publish job below elevates
# only its own token to add packages: write, per ADR-0004.
permissions:
  contents: read

# Group by ref, and never cancel a superseded publish run: an in-flight
# publish to `main` or a version tag must finish (or fail on its own), unlike
# PR validation runs which are safe to cancel.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publication never replaces tests: repeat the exact same validation job
  # pull requests run before touching GHCR.
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  publish:
    name: Build and publish image
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Compute image name and tags
        id: image
        shell: bash
        run: |
          set -euo pipefail

          owner_lower="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner_lower}/bigcontainers"
          sha_tag="sha-$(printf '%s' "${{ github.sha }}" | cut -c1-12)"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag_name="${{ github.ref_name }}"
            if [[ "${tag_name}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
              primary="${major}.${minor}.${patch}"
              additional="${major}.${minor},latest,${sha_tag}"
            else
              echo "::error::Tag '${tag_name}' does not match the required vX.Y.Z pattern."
              exit 1
            fi
          elif [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.ref_name }}" = "main" ]; then
            primary="main"
            additional="${sha_tag}"
          else
            echo "::error::Unsupported ref for publication: ${{ github.ref }}"
            exit 1
          fi

          all_tags="${primary},${additional}"

          {
            echo "image=${image}"
            echo "primary=${primary}"
            echo "additional=${additional}"
            echo "all_tags=${all_tags}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image with Jib
        working-directory: backend
        # Jib pushes directly from Gradle using the Docker credential
        # configuration written by the login step above; there is no Docker
        # daemon build/push step. Never pass -PskipFrontend here.
        run: |
          bash gradlew jib \
            "-Djib.to.image=${{ steps.image.outputs.image }}:${{ steps.image.outputs.primary }}" \
            "-Djib.to.tags=${{ steps.image.outputs.additional }}" \
            --stacktrace

      - name: Record published image digest
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          digest_file="build/jib-image.digest"
          if [ ! -f "${digest_file}" ]; then
            echo "::error::Jib did not write ${digest_file}; cannot record the published digest."
            exit 1
          fi
          digest="$(cat "${digest_file}")"

          {
            echo "### Published image"
            echo
            echo "- Image: \`${{ steps.image.outputs.image }}\`"
            echo "- Tags: \`${{ steps.image.outputs.all_tags }}\`"
            echo "- Digest: \`${digest}\`"
            echo "- Pull by digest: \`docker pull ${{ steps.image.outputs.image }}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
