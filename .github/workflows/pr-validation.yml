name: Pull request validation

on:
  pull_request:
    branches:
      - main

# Least-privilege default. This workflow never needs more than read access,
# and it never authenticates to GHCR or publishes an image, including for
# pull requests from forks (forked PRs run with a read-only GITHUB_TOKEN and
# no repository secrets, and there is no publish job here at all).
permissions:
  contents: read

# Cancel superseded runs for the same PR so stale pushes don't keep burning
# runner time.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml
